name: Simon Data
description: >-
  Simon Data — now trading as Simon AI, and acquired by Monetate on 30 July 2026 — is a composable, AI-first customer
  data platform for marketing teams. It reads customer data directly from a cloud warehouse (Snowflake, BigQuery,
  Redshift, Azure) without ETL, resolves identity into unified profiles, and activates segments across email, SMS,
  push, paid media and 70-plus downstream tools including Braze, Iterable, Attentive, Klaviyo, Salesforce Marketing
  Cloud, Amazon Ads and The Trade Desk. Two callable APIs are published: the Simon Signal Event Ingestion API, which
  accepts fourteen documented behavioural and transactional event types at a single collect endpoint, and the premium
  Audience API, which returns one contact profile at a time for send-time personalisation. Outbound webhooks and a
  Real-Time Content client cover the reverse direction, calling customer endpoints at send time.
