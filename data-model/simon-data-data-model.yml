identity_resolution:
  lookup_identifiers: [simonid, email, email-hash, primary-subscriber-key, riid, zendeskid]
  note: >-
    The Audience API's identity parameter doubles as a cross-platform bridge: primary-subscriber-key resolves a
    Salesforce Marketing Cloud subscriber, riid an Oracle Responsys recipient, zendeskid a Zendesk user.
