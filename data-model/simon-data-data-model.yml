- {name: complete_transaction, schema: complete_transaction_event, operation: complete_transactionEvent}
- {name: custom, schema: custom_event, operation: customEvent}
relationships:
- {from: identify_event, to: core_event, kind: composed_of, via: allOf}
- {from: identify_event, to: traits, kind: has_one, via: traits}
- {from: track_event, to: core_event, kind: composed_of, via: allOf}
- {from: core_event, to: context, kind: has_one, via: context}
- {from: add_to_cart_event, to: cartitem_with_quantity, kind: has_many, via: cart}
- {from: cart_event, to: cartitem_with_quantity, kind: has_many, via: cart}
- {from: complete_transaction_event, to: cartitem_with_quantity, kind: has_many, via: cart}
- {from: product_view_event, to: cartitem, kind: has_one, via: product}
