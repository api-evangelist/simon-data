source: openapi/simon-data-event-ingestion-openapi.yml, openapi/simon-data-audience-api-openapi.yml
note: >-
  Derived from the $ref graph of Simon Data's own published event schemas plus the Audience API response shape. The
  Simon Signal model is compositional rather than relational: every event schema is an allOf of core_event (the
  envelope) and track_event or identify_event (the type discriminator), then adds its own properties. There are no id
  reference fields between resources, because there is only one write endpoint and one read endpoint — identity is
  carried by natural keys (partnerId, clientId, userId, traits.email), not by opaque resource ids.
entities:
- name: core_event
  role: envelope
  description: Required envelope on every Simon Signal event.
  required: [partnerId, partnerSecret, clientId, context, sentAt, type]
  keys:
  - {field: partnerId, kind: tenant-key, description: Internal Simon identifier for the customer's site.}
  - {field: clientId, kind: device-or-session-key, max_length: 45}
  - {field: partnerSecret, kind: credential}
  discriminator: {field: type, values: [track, identify]}
- name: context
  role: embedded
  description: Client library, page and device context for an event.
  fields: [debug, name, version, userAgent, page, page.url, device, device.type]
- name: traits
  role: embedded
  description: Person-level attributes attached to an event.
  required: [email]
  fields: [email, firstName, lastName, name, userId, username, ARN, properties]
- name: cartitem
  role: embedded
  description: Product line without quantity.
  fields: [productId, variant, productImageUrl, productUrl, brand, category, color, productName, size, style, price, properties]
- name: cartitem_with_quantity
  role: embedded
  description: Product line with quantity; used by cart-shaped events.
- name: track_event
  role: abstract
  description: Behavioural event base, composed with core_event.
- name: identify_event
  role: concrete
  description: Person-resolution event carrying traits.
- name: contact
  role: read-model
  api: Audience
  description: >-
    The contact profile returned by GET /contacts. Its properties are tenant-specific — a field appears only if it is
    configured as "content" in the Simon account — so the schema is open by design. Observed in the published example:
    email_address, first_name, address_city, address_state, flow_variant_membership, total_lifetime_value_jde.
  keys:
  - {field: identity, kind: lookup-key, format: 'identifier:id'}
event_types:
