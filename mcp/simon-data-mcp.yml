note: >-
  Simon Data runs an MCP authorization surface. app.simondata.com publishes RFC 8414 Authorization Server Metadata whose
  three endpoints are all namespaced under /mcp/oauth/ and which advertises dynamic client registration plus PKCE S256 —
  the exact discovery shape an MCP client uses to obtain a token for a hosted MCP server. The endpoints are live
  (GET /mcp/oauth/authorize 302s to the Simon login, /mcp/oauth/token and /mcp/oauth/register return 405 to GET, meaning
  they exist and require POST). The MCP transport endpoint itself is NOT anonymously discoverable — every candidate path
  probed under app.simondata.com (/mcp, /mcp/sse, /mcp/http, /mcp/messages, /mcp/rpc, /mcp/stream, /api/mcp, /sse and
  others) returned the app's HTML 404, and app.simondata.com/robots.txt disallows all crawling. No endpoint URL is
  recorded here because none was observed; guessing one would assert an agent surface we did not reach.
  tools/list could therefore not be called, so no tool inventory exists and no tool crosswalk is emitted.
  Separately, the Simon web app ships a "Connected tools" area at /ai/connected-tools behind the
  ai.external_mcp_servers feature flag — Simon acting as an MCP *client* against customer-supplied servers. That is a
  distinct surface from the OAuth server metadata above.
