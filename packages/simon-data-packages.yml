note: >-
  Simon Data publishes no first-party client SDK for either of its APIs. npm has no simondata/@simondata package; the
  npm package literally named `simon.js` is "Simple NodeJS framework" by an unrelated author (skamenetskiy, last
  published 2022-06-26) and must not be mistaken for Simon Data's browser library. PyPI has no simondata or simon-data
  package. Simon Data's GitHub organisation (github.com/Radico, display name "Simon AI", 59 public repos) publishes
  Singer taps that pull data OUT of third-party APIs into Simon (tap-klaviyo, tap-sendgrid, tap-zendesk, tap-bynder,
  tap-contentful and ~20 more), forks of other vendors' MCP servers, and infrastructure forks — none of them is a client
  library for the Simon Data API. Integration is by raw HTTP, or by the tenant-hosted Simon.JS tag catalogued in
  components/. No SDKs pointer is emitted, because there is no SDK.
